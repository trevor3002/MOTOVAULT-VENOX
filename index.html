<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101411">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MotoVault">
  <meta name="description" content="MotoVault — organize every part, step and note while dismantling and rebuilding your motorcycle.">
  <title>MotoVault | Venox Workshop</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="MotoVault home">
        <span class="brand-mark">MV</span>
        <span><strong>MOTOVAULT</strong><small>VENOX WORKSHOP</small></span>
      </a>
      <button class="icon-button" id="exportBtn" aria-label="Export backup" title="Export backup">↗</button>
    </header>
    <main id="app" tabindex="-1">
      <section class="loading-screen" aria-live="polite"><span class="loader"></span><p>Opening your workshop…</p></section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="#home" data-nav="home"><span>⌂</span><small>Home</small></a>
      <a href="#parts" data-nav="parts"><span>▦</span><small>Parts</small></a>
      <a href="#steps" data-nav="steps"><span>☑</span><small>Steps</small></a>
      <a href="#manual" data-nav="manual"><span>▤</span><small>Manual</small></a>
      <a href="#notes" data-nav="notes"><span>✎</span><small>Notes</small></a>
    </nav>
  </div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
